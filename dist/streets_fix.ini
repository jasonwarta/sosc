[fix]
; main loop frame cap (0 = off)
fps=120
; 1 = give the game an exact frame time (smoother motion, and needed for fps above 30); 0 = the original 15.6 ms clock
precisetime=1
; frameprofile=1 adds a sim/render/post/swap time breakdown to the "main loop" log line
frameprofile=1
; W/A/S/D act as arrow keys
wasd=1
; file access logging: 0 off, 1 failures, 2 everything
logfiles=1
; game folder stands in for the CD (ISO not needed)
nocd=1
; cap on blocking music/screen fades in ms (0 = original timing)
fademax=250
; log where the game is stuck when it freezes for 0.5 s+
stallwatch=1
; emergency quit: Ctrl+Shift+F12 (always on)
; widescreen research: log viewport-like values 5 s after 3D starts (also Ctrl+Shift+F11)
viewportscan=1
; 3D renderer: set by the Play shortcut (-o2 = OpenGL). This line only applies through streets_launch.exe.
renderer=opengl
; widescreen (OpenGL only): auto = your monitor's shape, off = original 4:3, or a ratio like 16:9 / 21:9
widescreen=auto
; draw distance set at every launch: max (= 24), 0..24 (map grid = value x 2 + 13 tiles), or game = keep the in-game setting
drawdistance=max
; worldtiles=61 is how many map tiles across the world is drawn at the "max" draw distance.
; The game stops at 61; up to 125 works (more is slower: the polygon count grows with the area).
; Ctrl+Shift+F9 in game cycles 61, the middle size and worldtiles (61 -> 77 -> 91 at 91).
worldtiles=91
; worldstart: the size to start at; 0 = the middle size (77 at worldtiles=91)
worldstart=0
; 3D resolution set at every launch: high, lowhigh (drops to low res when busy), low, or game = keep the in-game setting
resolution=high
; OpenGL: depth-test tree/pedestrian sprites so far ones don't flicker or show through hills (1 = on, 0 = off)
spritedepth=1
; hotkeys: Ctrl+Shift+F10 screenshot (game\screenshots), Ctrl+Shift+F12 emergency quit
; diagnostics: save HUD images and textures as PNG under logs\dumps
dumpimages=0
; persistentgl=1 keeps one OpenGL context for the whole session, so textures survive trips
; through the menus (Esc, graphics dialog). 0 = the game deletes and recreates it each time.
persistentgl=1
; ddraw8bpp=1 keeps DirectDraw at 8-bit colour in OpenGL mode, so message boxes (YOU WON!,
; quit confirmation) draw correctly. 0 = the original 16-bit switch.
ddraw8bpp=1
; texturedump=1 saves every distinct game texture once to textures\dump (for making
; high-resolution replacements) and logs per-site texture statistics.
texturedump=0
; hdtextures=1 loads high-resolution replacements from textures\hd\<hash>.png (made by
; tools\upscale_textures.py from a texturedump=1 collection).
hdtextures=1
; extendhud=1 stretches the edges of the in-car dashboard to the sides of a widescreen view.
extendhud=1
; texprobe=1 logs textures that are bound in only some frames (animated textures).
texprobe=0
; wavems=33 steps the water waves (the surface rising and falling) every 33 ms of real time.
; The original stepped them twice per frame, so they ran 4x too fast at 120 fps. 0 = original.
wavems=33
; wateranimms=67 steps the water animation by real time (ms per frame; 67 = the speed at 30 fps).
; 0 = tied to frame rate like the original.
wateranimms=133
; hdwater=1 uses one HD water frame drifting smoothly instead of the original five-frame
; flipbook (the upscaled frames differ too much to flip between).
hdwater=1
; waterdrift=4 is the HD water drift speed (texels of a 32-texel tile per second).
waterdrift=4
; moose=1 replaces the cow with a bull moose (model and sounds from mods\moose, installed into
; GEO and SOUND at launch with the originals kept as *.orig). 0 puts the cow back.
moose=1
; carhitbox=70 shrinks the points where cars are tested against buildings to 70% of the
; original (they clipped buildings they visibly cleared). 100 = original, 50-150.
carhitbox=70
